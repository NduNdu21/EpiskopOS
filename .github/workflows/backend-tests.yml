name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch: 

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: episkopos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Apply schema
        run: psql "$TEST_DATABASE_URL" -f backend/db/schema.sql
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/episkopos_test

      - name: Run tests
        working-directory: backend
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/episkopos_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/episkopos_test
          JWT_SECRET: test-secret-key
          NODE_ENV: test
          VAPID_PUBLIC_KEY: BEl62iUYgUivxIkv69yViEuiBIa40HI0DLLuxazjBWk1sJRIzvUUD8u_HKlcbfFm-C79-3vP-BdPHiFYYOEOKuA
          VAPID_PRIVATE_KEY: UUxI4O8-FbRouAevSmBQ6o18hgE4nSG3qwvJTfKc-ls
          VAPID_SUBJECT: mailto:test@example.com